{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Online{% endblock %} — BP Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
</head>
<body>
<div class="page-wrapper">

    <header class="site-header">
        <a href="{% url 'home' %}" class="logo">BP <span>Solutions</span></a>
    </header>

    <div class="body-layout">

        <nav class="site-nav">
            <div class="nav-section-title">Navigazione</div>
            <a href="{% url 'home' %}" class="{% if active == 'home' %}active{% endif %}">Home</a>

            <div class="nav-section-title">Ricerca</div>
            <a href="#" class="{% if active == 'utenti' %}active{% endif %}">Utenti</a>
            <a href="#" class="{% if active == 'quiz' %}active{% endif %}">Quiz</a>
            <a href="#" class="{% if active == 'partecipazioni' %}active{% endif %}">Partecipazioni</a>
        </nav>

        <div class="main-area">
            {% block search_panel %}{% endblock %}
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </div>

    </div>

    <footer class="site-footer">
        Progetto d'esame — Programmazione Web 2025-2026 — Gruppo BP Solutions
    </footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
